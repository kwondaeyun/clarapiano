<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예약·문의 | 클라라슈만피아노학원</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">클라라슈만피아노학원</div>
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
      <nav>
        <ul>
          <li><a href="index.html">홈</a></li>
          <li><a href="menu.html">메뉴</a></li>
          <li><a href="about.html">가게 소개</a></li>
          <li><a href="location.html">오시는 길</a></li>
          <li><a href="contact.html" class="active">예약·문의</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <aside class="quick-menu">
    <a href="contact.html" class="quick-btn">상담예약</a>
    <a href="location.html" class="quick-btn">오시는길</a>
    <a href="tel:053-965-2545" class="quick-btn">전화문의</a>
  </aside>

  <main>
    <section>
      <h2 class="section-title">방문 상담 및 수강 문의</h2>
      <form class="contact-form">
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" placeholder="이름을 입력하세요">
        </div>

        <div class="form-group">
          <label for="phone">연락처</label>
          <input type="tel" id="phone" placeholder="010-0000-0000">
        </div>

        <div class="form-group">
          <label for="course">희망 과정</label>
          <select id="course">
            <option>성인 · 시니어 취미반</option>
            <option>유치부 · 초등부</option>
            <option>중 · 고등부</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">문의 내용</label>
          <textarea id="message" rows="5" placeholder="궁금하신 점을 남겨주세요."></textarea>
        </div>

        <button type="submit" class="submit-btn">상담 신청하기</button>
      </form>

      <div class="direct-contact">
        <p>전화 빠른 문의: <a href="tel:053-965-2545" class="phone-link">053-965-2545</a></p>
      </div>
    </section>
  </main>

  <footer>
    <p>대구 동구 신서동 영조1단지 후문 앞 | 문의: 053-965-2545</p>
    <p>&copy; Clara Schumann Piano Academy. All rights reserved.</p>
  </footer>
</body>
</html>
